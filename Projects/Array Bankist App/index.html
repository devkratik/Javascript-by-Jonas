<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bankist App</title>
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <script defer src="script.js"></script>
  </head>
  <body>
    <!--Navbar-->
    <nav class="navbar">
      <div class="navbar__message" id="nav-msg">Login to get started</div>
      <figure class="navbar__logo">
        <img
          src="./assets/logo.png"
          alt="Brand logo"
          class="navbar__logo-img"
        />
      </figure>
      <form class="login" id="login-form">
        <input
          type="text"
          class="login__name"
          id="input-name"
          placeholder="User"
        />
        <input
          type="password"
          class="login__password"
          id="input-pass"
          placeholder="PIN"
        />
        <button type="submit" class="login__submit" id="login-submit">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </nav>
    <!--Main-->
    <main class="container" id="app-container">
      <div class="info" id="info-container">
        <p class="info__title">Current Balance</p>
        <p class="info__subtitle">
          As of <span class="info__time" id="info-timings">. . .</span>
        </p>
      </div>
      <div class="balance" id="total-balance">
        <span class="balance__currency">₹</span>&nbsp;<span
          class="balance__value"
          id="balance-value"
          >00,000</span
        >
      </div>
      <div class="movements" id="movements-container">
        <!--transaction movements goes here dynamically-->
      </div>
      <div class="card transfer" id="transfer">
        <div class="card__title">Transfer money</div>
        <form class="card__form" id="transfer-form">
          <div class="group">
            <input type="text" id="reciever-acnt" />
            <label for="">Transfer to</label>
          </div>
          <div class="group">
            <input type="number" id="transfer-amount" />
            <label for="">Amount</label>
          </div>
          <button type="submit" id="transfer-btn">
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>
      <div class="card request" id="request">
        <div class="card__title">Request loan</div>
        <form class="card__form" id="request-form">
          <div class="group">
            <input type="number" id="request-amount" />
            <label for="">Amount</label>
          </div>
          <button type="submit" id="request-btn">
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>
      <div class="card close" id="close-acnt">
        <div class="card__title">Close account</div>
        <form class="card__form" id="close-form">
          <div class="group">
            <input type="text" id="close-username" />
            <label for="">Confirm user</label>
          </div>
          <div class="group">
            <input type="password" id="close-account-pass" />
            <label for="">Confirm PIN</label>
          </div>
          <button type="submit" id="close-btn">
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>
      <div class="summary" id="summary">
        <div class="incoming">
          <span class="incoming__symbol">IN</span>
          <p class="incoming__value">
            <span class="incoming__currency">₹</span>&nbsp;
            <span id="incoming-value">0,000</span>
          </p>
        </div>
        <div class="outgoing">
          <span class="outgoing__symbol">OUT</span>
          <p class="outgoing__value">
            <span class="outgoing__currency">₹</span>&nbsp;
            <span id="outgoing-value">0,000</span>
          </p>
        </div>
        <div class="interest">
          <span class="interest__symbol">INTEREST</span>
          <p class="interest__value">
            <span class="interest__currency">₹</span>
            <span id="interest-value">0,000</span>
          </p>
        </div>
        <div class="sort" id="sort-btn">
          <span class="sort__symbol"> <i class="fas fa-arrow-down"></i> </span
          >Sort
        </div>
      </div>
      <div class="timer" id="countdown-timer">timer</div>
    </main>
  </body>
</html>
